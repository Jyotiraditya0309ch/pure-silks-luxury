services:
  postgres:
    image: postgres:16
    container_name: pure-silks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pure_silks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pure-silks-postgres-data:/var/lib/postgresql/data

volumes:
  pure-silks-postgres-data:
